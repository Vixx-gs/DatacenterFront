<div class="login-wrapper">
  <div class="login-card">

    <div class="login-logo">
      <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="#0d3b3e" stroke-width="1.5"><rect x="2" y="3" width="20" height="14" rx="2"/><line x1="8" y1="21" x2="16" y2="21"/><line x1="12" y1="17" x2="12" y2="21"/></svg>
      <div class="login-title">DATA CENTER</div>
      <div class="login-subtitle">Gestión de flota y conductores</div>
    </div>

    <!-- Mensaje de sesión expirada -->
    <div class="session-alert" *ngIf="sessionMsg">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>
      {{ sessionMsg }}
    </div>

    <div class="login-form">
      <div class="form-group">
        <label class="form-label">Usuario</label>
        <input
          class="form-input"
          type="text"
          placeholder="Introduce tu usuario"
          [(ngModel)]="usuario"
          (keydown)="onKeyDown($event)"
          autocomplete="username"
          [class.input-error]="error" />
      </div>

      <div class="form-group">
        <label class="form-label">Contraseña</label>
        <div class="input-wrapper">
          <input
            class="form-input"
            [type]="showPassword ? 'text' : 'password'"
            placeholder="Introduce tu contraseña"
            [(ngModel)]="password"
            (keydown)="onKeyDown($event)"
            autocomplete="current-password"
            [class.input-error]="error" />
          <button class="toggle-pass" type="button" (click)="showPassword = !showPassword" tabindex="-1">
            <svg *ngIf="!showPassword" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
            <svg *ngIf="showPassword" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17.94 17.94A10.07 10.07 0 0112 20c-7 0-11-8-11-8a18.45 18.45 0 015.06-5.94M9.9 4.24A9.12 9.12 0 0112 4c7 0 11 8 11 8a18.5 18.5 0 01-2.16 3.19m-6.72-1.07a3 3 0 11-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/></svg>
          </button>
        </div>
      </div>

      <!-- Error -->
      <div class="error-msg" *ngIf="error">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><line x1="15" y1="9" x2="9" y2="15"/><line x1="9" y1="9" x2="15" y2="15"/></svg>
        {{ error }}
      </div>

      <button class="login-btn" (click)="login()" [disabled]="loading">
        <span *ngIf="!loading">Iniciar sesión</span>
        <span *ngIf="loading" class="spinner"></span>
      </button>
    </div>

    <div class="login-footer">
      Acceso restringido · 8:00 – 18:00h
    </div>

  </div>
</div>
