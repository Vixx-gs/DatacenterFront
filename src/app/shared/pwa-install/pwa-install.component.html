<div class="pwa-banner" *ngIf="showBanner">
  <div class="pwa-banner-content">
    <div class="pwa-icon">
      <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#5eead4" stroke-width="2">
        <rect x="2" y="3" width="20" height="14" rx="2"/><line x1="8" y1="21" x2="16" y2="21"/><line x1="12" y1="17" x2="12" y2="21"/>
      </svg>
    </div>
    <div class="pwa-text">
      <div class="pwa-title">Instalar Datacenter</div>
      <div class="pwa-desc" *ngIf="!isIos">Añade la app al escritorio para acceso rápido</div>
      <div class="pwa-desc" *ngIf="isIos">
        Pulsa <span class="ios-share">
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
            <path d="M4 12v8a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-8"/>
            <polyline points="16 6 12 2 8 6"/>
            <line x1="12" y1="2" x2="12" y2="15"/>
          </svg>
        </span> y luego <strong>«Añadir a inicio»</strong>
      </div>
    </div>
    <div class="pwa-actions">
      <button class="pwa-btn-install" *ngIf="!isIos" (click)="install()">Instalar</button>
      <button class="pwa-btn-close" (click)="dismiss()">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
          <line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/>
        </svg>
      </button>
    </div>
  </div>
</div>
