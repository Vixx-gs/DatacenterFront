name: Deploy Frontend

on:
  push:
    branches:
      - master

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Deploy to VPS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: 217.154.97.154
          username: root
          password: ${{ secrets.SSH_PASSWORD }}
          script: rm -rf /var/www/gesticotrans/datacenter-front/*

      - name: Upload files
        uses: appleboy/scp-action@v0.1.7
        with:
          host: 217.154.97.154
          username: root
          password: ${{ secrets.SSH_PASSWORD }}
          source: "dist/datacenter-front/*"
          target: "/var/www/gesticotrans/datacenter-front/"
          strip_components: 2
